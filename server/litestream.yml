# Continuous replication of the SQLite file to object storage, as an
# alternative to (or on top of) the snapshot script. Litestream tails the
# WAL and ships every change within seconds, so a lost disk costs seconds of
# work rather than an hour. Install litestream on the host and run:
#
#   litestream replicate -config litestream.yml
#
# Restore with:
#
#   litestream restore -config litestream.yml -o maily.db maily.db
#
# Fill in the bucket and credentials via the environment it reads
# (LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY).
dbs:
  - path: maily.db
    replicas:
      - type: s3
        bucket: ${BACKUP_BUCKET}
        path: temply/db
        region: ${BACKUP_REGION}
        endpoint: ${BACKUP_ENDPOINT}
        retention: 720h
        sync-interval: 10s
